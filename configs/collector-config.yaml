receivers:
  filelog:
    include: ["/var/log/pods/**/*.log"]
    start_at: beginning
    include_file_path: true
    include_file_name: false
    poll_interval: 200ms

    layout:
      type: json

    operators:
      - type: json_parser
        id: parse_json_logs
        timestamp:
          parse_from: body.ts
        severity:
          parse_from: body.level
        attributes:
          parse_from: body

processors:
  batch: {}
  k8sattributes: {}

exporters:
  otlp:
    endpoint: your-backend:4317
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [k8sattributes, batch]
      exporters: [otlp]



